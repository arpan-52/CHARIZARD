# scheduler_config.yaml - Housekeeper Configuration
# Example for NCRA Bhima cluster (PBS/OpenPBS)

scheduler: pbs

# Directories
working_dir: null
job_dir: ./jobs

# PBS-specific configuration
pbs:
  # Resource syntax: 'select' for OpenPBS, 'nodes' for Torque
  resource_style: select
  
  # Queue configuration
  queues:
    default: workq
    gpu: gpu
  
  # GPU configuration
  gpu:
    enabled: true
    host: bhima04
    ngpus: 1
    modules:
      - cuda/12.3
  
  # Directives for ALL jobs
  directives:
    - "-V"
    - "-j oe"
  
  # Modules for ALL jobs
  modules:
    - python/3.10
    - casa/6.5
  
  # Environment variables
  env_vars:
    OMP_NUM_THREADS: "4"
