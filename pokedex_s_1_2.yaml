# =============================================================================
# CHARIZARD - MeerKAT S-band, FULL POLARISATION, cross-cal -> selfcal
# Observation: 01-Mar-2026, 13:45-15:50 UTC, capture block 1772372562
#              22 scans / 12 compscans / 937 dumps @ 8 s
# Target cluster: NCRA bhima (OpenPBS)
# =============================================================================
# Usage: charizard run pokedex_s_1_2.yaml -s scheduler_bhima.yaml
#
# Fields in this MS (from the katdal scan report):
#   0  J0408-6545    04:08:20.38  -65:45:09.1  fluxcal bpcal delaycal   88 dumps
#   1  J0025-2602    00:25:49.16  -26:02:12.6  gaincal (BOTH targets)   82 dumps
#   2  J0011.7-1523  00:11:42.90  -15:23:22.0  target                  342 dumps
#   3  J0014.3-3022  00:14:20.03  -30:23:17.8  target                  341 dumps
#   4  J0521+1638    05:21:09.89  +16:38:22.1  polcal (3C138)           84 dumps
#
# Differences from the s_7_8 track this file was derived from:
#   - ONE gain calibrator (J0025-2602) serves both targets, not two.
#     No mapping is needed: applycal uses gainfield='nearest', so CASA picks
#     the nearest-in-time gaincal solution for each target scan.
#   - Both targets get 336 on-source dumps (~45 min) in two scans each,
#     bracketed by gaincal - a clean 2x(15+30) min alternation.
#
# Verified from the MS itself: 5 fields as listed, 1 SPECTRAL_WINDOW /
# 1 DATA_DESCRIPTION, CORR_TYPE = [9,10,11,12] = XX,XY,YX,YY (linear feeds).
#
# FULL POLARISATION run: leakage + pol_angle are both set, so CHARIZARD splits
# all 4 correlations, solves gaintype T with parang=True, runs Dflls leakage
# and XYf+QU/xyamb, and images I,Q,U,V. Roughly 2x the data of a Stokes-I run.
# =============================================================================

environment:
  working_dir: /scratch/apal/s_1_2
  scheduler: pbs                              # bhima is OpenPBS
  shell_preamble: |
    source ~/.bashrc
    micromamba activate 312data
    export UDOCKER_DIR=/home/apal/udocker

  container:
    image: apal52/charizard-pipeline:latest
    name: charizard
    # working_dir and the MS directory are mounted automatically. Both are
    # /scratch/apal/s_1_2 here, so nothing extra is needed - but note that
    # /scratch is a separate NFS export (10.1.1.2:/scratch) from /home. If you
    # ever point data.ms outside working_dir, add the mount here.
    volumes: []

  # Walltimes MUST be quoted - unquoted 12:00:00 is YAML sexagesimal (an int).
  #
  # nodes MUST be 1. No job in this pipeline is MPI - each one is a single
  # `udocker run casa|wsclean`. housekeeper turns nodes into a PBS select with
  # N chunks (and mem is PER chunk), so nodes>1 reserves hardware that sits
  # idle and can stop the job scheduling at all.
  #
  # ppn must stay equal to the *_NUM_THREADS values in scheduler_bhima.yaml.
  # Those are what stop catboss spawning a 64-thread pool on an 8-core cpuset.
  resources:
    default:   {nodes: 1, ppn: 4,  walltime: "04:00:00", mem_gb: 64}
    flagging:  {nodes: 1, ppn: 8,  walltime: "12:00:00", mem_gb: 128}
    crosscal:  {nodes: 1, ppn: 8,  walltime: "12:00:00", mem_gb: 128}
    selfcal:   {nodes: 1, ppn: 8,  walltime: "12:00:00", mem_gb: 128}
    imaging:   {nodes: 1, ppn: 8,  walltime: "24:00:00", mem_gb: 256}

data:
  ms: s_1_2.ms
  # 4096 ch -> 5% edge trim -> 3688 usable -> 922 ch per sub-band,
  # ~197 MHz each at 213.6 kHz resolution.
  # ASSUMED same correlator setup as s_7_8 (S0: 1750-2625 MHz, 4096 ch). The
  # SPECTRAL_WINDOW subtable was still inside the tarball when this file was
  # written - confirm before the run, see the note at the bottom.
  processing_spw: 4

sources:
  # false: skip detection entirely and trust the overrides below.
  # REQUIRED for MeerKAT - the bundled calibrator catalog is VLA-only and has
  # nothing below dec -45, so J0408-6545 (dec -65.8) would be misread as a
  # target, and so would J0025-2602 (dec -26) if it is not in the catalog.
  auto_detect: false

  overrides:
    calibrators:
      # J0408-6545 has no CASA flux standard. CHARIZARD builds a manual setjy
      # model from the SARAO/Partridge log-polynomial, refit onto setjy's
      # fluxdensity/spix form at this MS's centre frequency. The conversion is
      # exact and band-independent, so the published coefficients hold at
      # S-band with no adjustment.
      amp: J0408-6545

      # Single gain calibrator for both targets. fluxscale bootstraps it off
      # J0408-6545. It is 5.0 deg from J0014.3-3022 and 11.2 deg from
      # J0011.7-1523 - far, but that is what the track observed, and the
      # 15/30 min alternation keeps the interpolation short in time.
      phase: J0025-2602

      # REQUIRED. Without this, every field not listed as a calibrator becomes
      # a target - which would send J0521+1638 (3C138, the polcal) through
      # selfcal and a full 6144px clean for nothing.
      targets: [J0011.7-1523, J0014.3-3022]

      # Full polarisation. Setting BOTH of these switches on do_polcal:
      # 4-correlation split, gaintype T, Dflls leakage + XYf+QU/xyamb, and
      # selfcal images I,Q,U,V instead of I only.
      #   leakage   -> Dflls solves on the bandpass field (J0408-6545), which
      #                has two scans 2 h apart (13:45 and 15:45) and so gives
      #                real parallactic-angle coverage. SARAO prefer
      #                J1939-6342; J0408 is sanctioned but is ~0.1% linearly
      #                polarised. J1939 is not in this track.
      #   pol_angle -> J0521+1638 = 3C138, resolved via the alias table.
      leakage: J0408-6545
      pol_angle: J0521+1638

      # NOTE, for you to judge: the polcal has a SINGLE 10-min scan
      # (15:34-15:44) at HA ~ -4h, elevation ~14 deg. Parallactic angle moves
      # only a few degrees across it, so XYf+QU has essentially no PA leverage
      # to separate Q,U from the X-Y phase - it will lean entirely on the
      # supplied 3C138 model. That is the intended use here (the model resolves
      # the ambiguity rather than setting a scale), but the absolute pol angle
      # is only as good as that model. The leakage solve is unaffected.
      #
      # The bundled 3C138 model is the L-band entry (p=0.075 @ 1.4 GHz; nearer
      # 0.10 at 2.19 GHz). Left as-is deliberately, same as the s_7_8 run.

    uvranges:
      # J0408-6545 has a ~1% double lobe 5.5' away. At S-band the smaller
      # primary beam suppresses it and a point model is adequate (Hugo 2022,
      # Ranchod et al. 2024) - add a cut here only if the bandpass shows ripple.
      {}

flow:
  initial_calibration_flagging:
    setup: {brotherhood: true}                # all SPWs succeed together or all fail
    flagging:
      bad_antennas: {auto: true, list: []}    # add known-bad dishes to `list`
      use_gpu: true                           # routes to bhima04 via scheduler_bhima.yaml
    calibration:
      # refant omitted on purpose -> auto-selected after flagging from the
      # antennas actually present. Do NOT hardcode one until you have seen this
      # track's ANTENNA table; the s_7_8 array was missing m020/m030/m034/
      # m040/m060 and this one may differ.
      # refant: m008
      minblperant: 4                          # MeerKAT/IDIA convention
      control: {plot: true}                   # shadems diagnostics

  imaging_selfcal:
    setup: {brotherhood: true}
    dirty_image: true                         # sanity-check image before selfcal
    selfcal:
      avg_flag: true

      # Channel averaging before selfcal. Bandwidth smearing goes as
      # (dnu/nu) * (theta / theta_res). freqbin 4 gives ~0.85 MHz channels;
      # at the 0.35 deg half-power radius that is ~0.19, comfortably small.
      freqbin: 4

      # S-BAND, not L-band. 7.7 km max baseline at 2.19 GHz (lambda 13.7 cm)
      # -> ~3.7" synthesised beam, so 0.9" gives ~4 px/beam. An L-band 1.5"
      # cell would undersample this badly.
      # Primary beam FWHM is ~0.71 deg here (vs ~1.2 deg at L-band), so
      # 6144 px x 0.9" = 1.54 deg covers it out past the half-power point.
      # NOTE: no primary beam correction is applied - fluxes far off axis are
      # attenuated.
      imaging: {imsize: 6144, cellsize: 0.9asec}

      # factor is the single progression knob: each round multiplies niter by
      # it and divides threshold and solint by it.
      #
      # 45 min on source per target here, against the s_7_8 track's similar
      # integration - keep solint 2min -> 30s. If the first phase round shows
      # poor SNR per solution, raise min_solint rather than adding rounds.
      loops: {phase: 4, amp_phase: 1, solint: 2min, min_solint: 30s, factor: 2}
      clean: {threshold: 0.0005, start_iters: 2000, min_threshold: 0.0}

# Direction-dependent calibration. Left out deliberately for a first run -
# get a clean selfcal image before peeling. Uncomment to enable; it needs
# imaging_selfcal to have succeeded.
#
#  dd_cal:
#    source_finding:
#      flux_threshold_mJy: 50
#      region_radius_arcsec: 15.0
#      min_distance_fraction: 0.1
#    peeling:
#      time_chunk: 0
#      de_time_interval: 120s
#      de_freq_interval: 0
#    final_niter: 50000

# =============================================================================
# BEFORE RUNNING
#
# 1. The MS is still being untarred as of writing. When it is done:
#      mv /scratch/apal/1772372562-sdp-l0_2026-06-03T23-44-48_Vsf.ms \
#         /scratch/apal/s_1_2/s_1_2.ms
#    (a mv within /scratch is instant - a cp would copy ~350 GB)
#
# 2. Confirm the band and channel count match the header assumption:
#      python -c "from casacore.tables import table; \
#        c=table('/scratch/apal/s_1_2/s_1_2.ms/SPECTRAL_WINDOW').getcol('CHAN_FREQ')[0]; \
#        print(len(c), c[0]/1e6, c[-1]/1e6)"
#    Expect 4096, 1750, 2625. If nchan differs, processing_spw: 4 still works
#    but the per-sub-band width in the comment above is wrong. If the CENTRE
#    frequency differs, revisit cellsize (0.9asec assumes 2.19 GHz).
#
# 3. Space: the s_7_8 run peaked at ~1.8 TB of products for a 387 GB input.
#    /scratch has 75 TB free, so this is not a constraint.
# =============================================================================
