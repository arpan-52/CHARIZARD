# charizard/data/internal_models.yaml
# Internal calibrator models with RA/DEC for position matching
# Position matching is preferred over name matching (2 arcsec threshold)

# Standard CASA flux calibrators (setjy knows these)
casa_flux_cals:
  - 3C286
  - 3C48
  - 3C147
  - 3C138
  - J1939-6342
  - J0408-6545

# Which setjy standard to use per flux calibrator.
# Anything not listed here falls through to CASA's default (Perley-Butler 2017),
# which only covers the northern 3C sources.
#   Stevens-Reynolds 2016 - the only CASA standard containing 1934-638
#   manual                - no CASA standard exists; see manual_flux_models below
flux_standards:
  J1939-6342: "Stevens-Reynolds 2016"
  "1934-638": "Stevens-Reynolds 2016"
  "1939-637": "Stevens-Reynolds 2016"
  PKSB1934-638: "Stevens-Reynolds 2016"
  J0408-6545: manual
  "0408-65": manual
  "0408-655": manual
  PKSB0407-65: manual

# Sources with no CASA flux standard at all. Coefficients are for the
# log-log model used by SARAO:
#     log10(S) = a + b*log10(nu/MHz) + c*log10(nu/MHz)^2 + d*log10(nu/MHz)^3
# CHARIZARD refits this to setjy's
#     S = fluxdensity * (nu/reffreq)^(spix0 + spix1*L + spix2*L^2),  L=log10(nu/reffreq)
# over each SPW's own frequency range at solve time (see gains.py).
manual_flux_models:
  J0408-6545:
    ra: "04h08m20.4s"
    dec: "-65d45m09s"
    names: ["J0408-6545", "0408-65", "0408-655", "PKSB0407-65", "PKS B0407-65"]
    log_poly: [-0.9790, 3.3662, -1.1216, 0.0861]   # a, b, c, d  (Partridge et al. 2016)
    notes: "MeerKAT primary. No CASA standard; refit to a manual setjy model."

# Known unpolarized sources (good for leakage calibration)
known_unpolarized:
  J1939-6342:
    ra: "19h39m25.026s"
    dec: "-63d42m45.63s"
    names: ["J1939-6342", "1934-638", "1939-637", "PKSB1934-638", "PKS B1934-638"]
    notes: "MeerKAT primary flux/bandpass cal. <0.2% polarized, very stable."

  J0408-6545:
    ra: "04h08m20.4s"
    dec: "-65d45m09s"
    names: ["J0408-6545", "0408-65", "0408-655", "PKSB0407-65"]
    notes: "MeerKAT primary flux/bandpass cal. Low polarization."

  3C84:
    ra: "03h19m48.16s"
    dec: "+41d30m42.1s"
    names: ["3C84", "0319+415", "J0319+4130", "Perseus A"]
    notes: "Unpolarized, good for leakage, variable"
  
  OQ208:
    ra: "14h07m00.39s"
    dec: "+28d27m14.7s"
    names: ["OQ208", "1404+286", "J1407+2827"]
    notes: "Unpolarized, stable"
  
  3C147:
    ra: "05h42m36.14s"
    dec: "+49d51m07.2s"
    names: ["3C147", "0542+498", "J0542+4951"]
    notes: "Unpolarized, flux calibrator"

# Known polarized sources
known_polarized:
  3C286:
    ra: "13h31m08.29s"
    dec: "+30d30m32.9s"
    names: ["3C286", "1331+305", "J1331+3030"]
    notes: "Highly polarized (~10%), standard pol angle calibrator"
  
  3C138:
    ra: "05h21m09.89s"
    dec: "+16d38m22.1s"
    names: ["3C138", "0521+166", "J0521+1638"]
    notes: "Polarized but VARIABLE, use with caution"

# Full Stokes polarization models for polcal
# Required for polarization angle calibration
# NOTE: polarization_angle is in RADIANS (setjy convention) and is passed
# to setjy / the XYf+QU helper as-is, with no unit conversion.
polcal_models:
  3C286:
    ra: "13h31m08.29s"
    dec: "+30d30m32.9s"
    names: ["3C286", "1331+305", "J1331+3030"]
    stokes_I: 15.0
    spectral_index: [-0.465, -0.18]
    reffreq: "1.4GHz"
    polarization_fraction: [0.095]
    polarization_angle: [0.5759587]  # radians (33 deg)
    notes: "Standard pol angle calibrator, stable"
  
  3C138:
    ra: "05h21m09.89s"
    dec: "+16d38m22.1s"
    names: ["3C138", "0521+166", "J0521+1638"]
    stokes_I: 8.5
    spectral_index: [-0.5]
    reffreq: "1.4GHz"
    polarization_fraction: [0.075]
    polarization_angle: [-0.1745329]  # radians (-10 deg)
    notes: "VARIABLE - use 3C286 if possible"

  3C48:
    ra: "01h37m41.30s"
    dec: "+33d09m35.1s"
    names: ["3C48", "0137+331", "J0137+3309"]
    stokes_I: 16.5
    spectral_index: [-0.8]
    reffreq: "1.4GHz"
    polarization_fraction: [0.005]
    polarization_angle: [0.4363323]  # radians (25 deg)
    notes: "Low polarization, flux calibrator"