environment:
  working_dir: /home/YOUR_USER/data          # UPDATE: your working directory on bhima
  scheduler: pbs
  shell_preamble: |
    source ~/.bashrc
    micromamba activate 312data
    export UDOCKER_DIR=/home/YOUR_USER/udocker       # UPDATE: udocker dir on bhima

  container:
    name: charizard
    volumes: []                               # extra bind-mounts if needed

  # walltimes must be quoted - unquoted 12:00:00 is YAML sexagesimal (an integer)
  resources:
    default:   {nodes: 1, ppn: 4,  walltime: "04:00:00", mem_gb: 64}
    flagging:  {nodes: 1, ppn: 8,  walltime: "08:00:00", mem_gb: 128}
    crosscal:  {nodes: 1, ppn: 8,  walltime: "12:00:00", mem_gb: 128}
    selfcal:   {nodes: 1, ppn: 4,  walltime: "12:00:00", mem_gb: 64}
    imaging:   {nodes: 1, ppn: 8,  walltime: "24:00:00", mem_gb: 256}

data:
  ms: TARGET.ms                               # UPDATE: your MS filename
  processing_spw: 4

sources:
  auto_detect: true    # false = skip detection, use overrides only
  overrides:
    calibrators: {amp: [3C286, 3C48], phase: 1845+401, leakage: 1845+401, pol_angle: 3C286}
    uvranges: {"3C286": "0~56klambda", "3C48": ""}

flow:
  initial_calibration_flagging:
    setup: {brotherhood: true}
    flagging:
      bad_antennas: {auto: true, list: []}    # auto=false skips detection, applies list only
      use_gpu: true                           # routes to bhima04 via scheduler.yaml
    calibration:
      refant: C00
      control: {plot: true}

  imaging_selfcal:
    setup: {brotherhood: true}
    dirty_image: true
    selfcal:
      avg_flag: true
      freqbin: 10
      imaging: {imsize: 7200, cellsize: 1asec}
      loops: {phase: 4, amp_phase: 2, solint: 4min, min_solint: 8s, factor: 2, refant: C00}
      clean: {threshold: 0.001, start_iters: 1000, min_threshold: 0.0}

  dd_cal:
    source_finding:
      flux_threshold_mJy: 50
      region_radius_arcsec: 15.0
      min_distance_fraction: 0.1   # don't peel sources inside this fraction of the image half-width (selfcal handles the center)
    peeling:
      time_chunk: 0
      de_time_interval: 120s
      de_freq_interval: 0
    final_niter: 50000
